image: mcr.microsoft.com/playwright:v1.42.1-jammy

stages:
  - install
  - test
  - deploy

variables:
  NODE_ENV: test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - ~/.npm/

install:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

playwright-tests:
  stage: test
  dependencies:
    - install
  matrix:
      - PROJECT: chromium
      - PROJECT: firefox
      - PROJECT: webkit
  script:
    # Install browsers (required in CI)
    - npx playwright install --with-deps
    # Run tests in parallel across workers and projects
    - npx playwright test --workers=4
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/results.xml
    expire_in: 7 days
  parallel: 3   # Each project (chromium, firefox, webkit) can run in parallel
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure